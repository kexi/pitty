[package]
name = "pitty"
version = "1.2.2"
edition = "2021"
license = "MIT"
description = "PTY-based CLI testing framework"
repository = "https://github.com/kexi/pitty"
readme = "README.md"
keywords = ["pty", "e2e", "testing", "cli", "terminal"]
categories = ["command-line-utilities", "development-tools::testing"]

[[bin]]
name = "pitty"
path = "src/main.rs"

[lib]
name = "pitty"
path = "src/lib.rs"

[dependencies]
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
serde_json = "1"
regex = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "1"
tempfile = "3"
# similar is MIT OR Apache-2.0; its MIT option is compatible with this crate's
# MIT license.
similar = "2"

# Job objects for killing the whole process tree under a ConPTY session on
# teardown. winapi is already in the graph through portable-pty, so this adds
# feature flags, not a crate.
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["handleapi", "jobapi2", "winnt"] }

[dev-dependencies]
