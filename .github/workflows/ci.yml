# CI for pitty.
#
# Toolchain comes from the repo's `nix develop` shell (flake-utils +
# rust-overlay), so every job invokes cargo through `nix develop --command` to
# get the exact pinned Rust toolchain rather than a separately installed one.
# The `nix-build` job is the exception: it builds the flake *package*
# (nix/package.nix) rather than borrowing the shell's toolchain, because that is
# the artifact `nix profile install github:kexi/pitty` produces and nothing else
# in CI evaluates it.
#
# Action pinning: actions are pinned to immutable commit SHAs with version
# comments. `pinact run -fix=false -verify` gates supported pins/comments, so a
# mutable tag or stale version annotation fails CI. The sole exception is
# dtolnay/rust-toolchain, which has no semver tag for pinact to verify; it is
# still manually SHA-pinned and receives `toolchain: stable` explicitly.
#
# Nix cache choice: we use DeterminateSystems/magic-nix-cache-action. Its free
# tier was shut down in early 2025 and later revived against GitHub's new cache
# API, but that integration is reverse-engineered and may break without notice.
# It is configured to fail soft (a cache fault must not fail the build); if it
# regresses, drop the cache step (build is correct without it, only slower) or
# swap in nix-community/cache-nix-action.
#
# The cache authenticates to FlakeHub over OIDC, so each job that uses it also
# grants `id-token: write`. Without that the action logs "FlakeHub Cache is
# disabled due to missing or invalid token" — which is what happened up to
# v1.2.2, when only `contents: read` was granted.
#
# That grant is necessary but NOT sufficient: FlakeHub Cache itself needs a paid
# Determinate subscription, which this repo does not have. Login now succeeds,
# then every read returns `HTTP 401 ... "User is not authorized for this
# resource."` and the action falls back to the GitHub Actions cache on
# 127.0.0.1. Measured cold-vs-warm job times are unchanged, so do not expect a
# speedup from the FlakeHub side. Keep `id-token: write` anyway — it costs
# nothing and is the prerequisite if a subscription is ever added. If a real
# speedup is wanted without paying, swap in nix-community/cache-nix-action,
# which caches /nix/store through the plain GitHub Actions cache.
name: CI

on: [push, pull_request]

# Least privilege: every job only checks out, builds, and tests — none write
# back to the repo. Pinning the token to read-only here means the code we build
# and run (including the nested pitty the dogfood spawns) cannot use
# GITHUB_TOKEN to mutate the repository even if the default were write.
permissions:
  contents: read

jobs:
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-latest
    # FlakeHub Cache authenticates over OIDC, which needs `id-token: write`.
    # Granted per job rather than at the top level so the two jobs that do not
    # use the cache (gitleaks, test-windows) never receive a token they have no
    # use for. `contents: read` is restated because a job-level `permissions:`
    # block replaces the top-level one outright instead of merging with it.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - name: pinact verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix develop --command pinact run -fix=false -verify
      - name: cargo fmt --check
        run: nix develop --command cargo fmt --check
      - name: cargo clippy
        run: nix develop --command cargo clippy --all-targets -- -D warnings

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    # The action comments findings on the PR via GITHUB_TOKEN, which needs write
    # access to pull requests. Granted only here, not at the top level, so every
    # other job keeps the read-only default. contents:read is restated because
    # declaring job-level permissions drops the inherited top-level set.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # fetch-depth: 0 so the scan can resolve the PR base ref and check every
      # commit in the range — catching a secret added in an intermediate commit
      # even if a later commit removes it. On push it scans the full history.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      # The official action over a dev-shell `run:` step: it bundles a maintained
      # scanner and posts findings as PR comments. SHA-pinned because a secret
      # scanner with a write-scoped token is supply-chain sensitive.
      #
      # Config-tampering note: the action reads whatever .gitleaks.toml is in the
      # tree, so it does NOT by itself stop a PR from weakening the ruleset in the
      # same PR. Guard that operationally (review / branch protection requiring
      # this check). GITLEAKS_LICENSE is only needed for org repos; this is a
      # personal repo, so it is intentionally omitted.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  test:
    name: test (unit + integration)
    runs-on: ubuntu-latest
    # See the lint job for why id-token is granted per job.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      # Non-ignored tests only; the PTY-gated #[ignore] tests run in pty-e2e.
      - name: cargo test
        run: nix develop --command cargo test
      # Cross-check Windows compilation from the pinned dev shell so non-Windows
      # jobs catch obvious cfg/type regressions before the native Windows job
      # reaches runtime smoke coverage.
      - name: cargo check (Windows target)
        run: nix develop --command cargo check --target x86_64-pc-windows-msvc --all-targets

  nix-build:
    name: nix-build (flake package)
    runs-on: ubuntu-latest
    # Deliberately no `needs:`. Unlike pty-e2e, this gate shares no setup with
    # lint/test and only reads Cargo.lock, so serializing it behind them would
    # add its full cold-build time to the critical path for no ordering benefit.
    # See the lint job for why id-token is granted per job.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      # The other jobs use the flake only as a toolchain provider, so they never
      # evaluate nix/package.nix and cannot catch a stale `cargoHash`. That gap
      # let v1.2.0 and v1.2.1 ship with the README's `nix profile install
      # github:kexi/pitty` path broken. `nix build .#default` (not `nix flake
      # check`) is the gate: checks.pitty is the same derivation, but flake check
      # also drags in the devShell's separate rust-overlay toolchain for no extra
      # signal here — and this is the exact command the README tells users to run.
      # Ubuntu-only: the vendor hash is a pure function of Cargo.lock and does not
      # vary by system, so a macOS copy would cost double for no added coverage.
      - name: nix build
        run: nix build .#default
      # Catch a build that succeeds but yields a broken artifact (missing bin or
      # a wrong meta.mainProgram), which the derivation alone would not surface.
      - name: pitty --version
        run: ./result/bin/pitty --version

  test-windows:
    name: test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
      # Non-ignored tests compile the Windows ConPTY backend and exercise the
      # PTY-free contracts without assuming bash/Nix exists on Windows. Split
      # them so a Windows-only hang names the specific target; serialize test
      # threads because several tests intentionally mutate process env vars.
      - name: cargo test (lib + bin)
        timeout-minutes: 20
        run: cargo test --lib --bins -- --test-threads=1
      - name: cargo test (marketplace action contract)
        timeout-minutes: 5
        run: cargo test --test marketplace_action_contract -- --test-threads=1
      - name: cargo test (release asset contract)
        timeout-minutes: 5
        run: cargo test --test release_asset_name_contract -- --test-threads=1
      - name: cargo test (report JSON contract)
        timeout-minutes: 5
        run: cargo test --test report_json_contract -- --test-threads=1
      - name: cargo test (schema contract)
        timeout-minutes: 5
        run: cargo test --test schema_contract -- --test-threads=1
      - name: cargo test (file-only e2e)
        timeout-minutes: 5
        run: cargo test --test e2e -- --test-threads=1
      - name: cargo build
        run: cargo build
      # A minimal real-PTY smoke test covers the Windows-specific runtime path:
      # portable-pty must spawn cmd.exe through ConPTY, accept CR-terminated
      # input, observe output, and collect the exit status.
      - name: dogfood Windows cmd smoke
        shell: pwsh
        run: |
          $env:PITTY_BIN = (Resolve-Path target/debug/pitty.exe).Path
          & $env:PITTY_BIN run e2e/scenarios/windows

  pty-e2e:
    name: pty-e2e (ignored tests + dogfood)
    runs-on: ubuntu-latest
    needs: [lint, test]
    # See the lint job for why id-token is granted per job.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      # GitHub Actions ubuntu runners can openpty, so the real-PTY path and the
      # nested-PTY dogfood below both work. If the nested-PTY meta tier ever
      # proves unstable on ubuntu, demote the "dogfood: meta tier" step to a
      # separate continue-on-error job rather than failing the gate. (macOS is a
      # required gate too — see the pty-e2e-macos job below.)

      # Residual negative e2e tests kept in tests/e2e.rs as a fallback until the
      # dogfood meta tier is proven stable across runners.
      - name: cargo test -- --ignored
        run: nix develop --command cargo test -- --ignored

      - name: cargo build
        run: nix develop --command cargo build

      # Dogfood: run pitty against its own scenarios. PITTY_BIN and INNER_DIR
      # are exported here and resolved inside meta scenarios via ${var} expansion
      # (parent-env fallback in src/workspace.rs). Each step's exit code is the
      # pass/fail gate: a non-zero pitty exit fails the CI step.
      - name: dogfood positive tier
        run: |
          export PITTY_BIN="$PWD/target/debug/pitty"
          export INNER_DIR="$PWD/e2e/scenarios/meta/inner"
          # Env-existence guard: the meta tier resolves ${PITTY_BIN}/${INNER_DIR}
          # from the parent env. If either is unset/missing the placeholders would
          # spawn-fail into exit 3 and the empty-spawn meta case would falsely
          # PASS. Fail loudly here instead.
          test -x "$PITTY_BIN" || { echo "PITTY_BIN not executable: $PITTY_BIN" >&2; exit 1; }
          test -d "$INNER_DIR" || { echo "INNER_DIR not a directory: $INNER_DIR" >&2; exit 1; }
          nix develop --command "$PITTY_BIN" run e2e/scenarios/positive
      - name: dogfood meta tier (nested PTY)
        run: |
          export PITTY_BIN="$PWD/target/debug/pitty"
          export INNER_DIR="$PWD/e2e/scenarios/meta/inner"
          test -x "$PITTY_BIN" || { echo "PITTY_BIN not executable: $PITTY_BIN" >&2; exit 1; }
          test -d "$INNER_DIR" || { echo "INNER_DIR not a directory: $INNER_DIR" >&2; exit 1; }
          nix develop --command "$PITTY_BIN" run e2e/scenarios/meta
      # Dogfood the matrix/bench subcommands too: e2e/scenarios/samples carries
      # passing matrix (single- and multi-axis) and bench scenarios. `run` does
      # not exercise these subcommands, so without this step a regression in
      # `pitty matrix`/`pitty bench` would not be caught by CI. Each subcommand
      # exits 0 on an all-pass scenario; a failing cell/run flips it non-zero.
      - name: dogfood samples tier (matrix + bench)
        run: |
          export PITTY_BIN="$PWD/target/debug/pitty"
          test -x "$PITTY_BIN" || { echo "PITTY_BIN not executable: $PITTY_BIN" >&2; exit 1; }
          nix develop --command "$PITTY_BIN" matrix e2e/scenarios/samples/matrix-shell.yaml
          nix develop --command "$PITTY_BIN" matrix e2e/scenarios/samples/matrix-multi-axis.yaml
          nix develop --command "$PITTY_BIN" bench e2e/scenarios/samples/bench-shell.yaml --runs 3

  pty-e2e-macos:
    name: pty-e2e (macOS)
    runs-on: macos-latest
    needs: [lint, test]
    # Required gate: the user runs pitty locally on macOS often, so a macOS PTY
    # regression must block merges, not just inform. macOS PTY teardown is slower
    # than Linux, which is why the meta tier waits for inner exit via
    # expect_exit's deadline form rather than a fixed `wait` — the stabilization
    # that makes this gate non-flaky. Do NOT reintroduce continue-on-error.
    # See the lint job for why id-token is granted per job.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - name: cargo test -- --ignored
        run: nix develop --command cargo test -- --ignored
      - name: cargo build
        run: nix develop --command cargo build
      - name: dogfood positive tier
        run: |
          export PITTY_BIN="$PWD/target/debug/pitty"
          export INNER_DIR="$PWD/e2e/scenarios/meta/inner"
          test -x "$PITTY_BIN" || { echo "PITTY_BIN not executable: $PITTY_BIN" >&2; exit 1; }
          test -d "$INNER_DIR" || { echo "INNER_DIR not a directory: $INNER_DIR" >&2; exit 1; }
          nix develop --command "$PITTY_BIN" run e2e/scenarios/positive
      - name: dogfood meta tier (nested PTY)
        run: |
          export PITTY_BIN="$PWD/target/debug/pitty"
          export INNER_DIR="$PWD/e2e/scenarios/meta/inner"
          test -x "$PITTY_BIN" || { echo "PITTY_BIN not executable: $PITTY_BIN" >&2; exit 1; }
          test -d "$INNER_DIR" || { echo "INNER_DIR not a directory: $INNER_DIR" >&2; exit 1; }
          nix develop --command "$PITTY_BIN" run e2e/scenarios/meta
      # Dogfood the matrix/bench subcommands too (see the ubuntu job for why).
      - name: dogfood samples tier (matrix + bench)
        run: |
          export PITTY_BIN="$PWD/target/debug/pitty"
          test -x "$PITTY_BIN" || { echo "PITTY_BIN not executable: $PITTY_BIN" >&2; exit 1; }
          nix develop --command "$PITTY_BIN" matrix e2e/scenarios/samples/matrix-shell.yaml
          nix develop --command "$PITTY_BIN" matrix e2e/scenarios/samples/matrix-multi-axis.yaml
          nix develop --command "$PITTY_BIN" bench e2e/scenarios/samples/bench-shell.yaml --runs 3
