# Multi-axis matrix dogfood sample: the Cartesian product of two axes.
#
# Two axes (`command` and `region`) of two values each expand to 4 cells —
# every (command, region) combination. Each cell injects both `${command}` and
# `${region}` into a single shell line, so the assertion stays shared while the
# spawned line varies per cell. Cell order is deterministic: axes in
# lexicographic key order (command, region), later axis varying fastest:
# (echo,us), (echo,eu), (printf,us), (printf,eu).
#
# Run with: pitty matrix e2e/scenarios/samples/matrix-multi-axis.yaml
name: matrix-multi-axis
workspace:
  temp: true
matrix:
  command: ["echo", "printf"]
  region: ["us", "eu"]
steps:
  - spawn: bash
  # Computed suffix (see positive/echo-flow.yaml) so the echoed input
  # `matched-us-$((40+2))` cannot satisfy the per-cell needle.
  - send: "${command} matched-${region}-$((40+2))"
  # A regex rather than `contains: matched-${region}-42`: `${var}` expands in
  # `send`, not in matcher fields, so the needle cannot name the cell's own
  # region. The alternation proves the injected value is one of the axis
  # values and that the line was produced by execution (the echo carries
  # `$((40+2))`, never `42`); it does not distinguish the us cell from the eu
  # cell. Per-cell matching would need matcher expansion, which is not part of
  # the scenario contract.
  - expect_regex:
      pattern: "matched-(us|eu)-42"
      timeout: 10s
