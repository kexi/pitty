# Dogfood: exit-code propagation. Mirrors the former tests/e2e.rs
# `exit_code_assertion_passes`. A child that exits must satisfy expect_exit: 0.
# The wait gives the shell time to exit before the non-blocking exit poll.
name: exit-zero
workspace:
  temp: true
steps:
  - spawn: bash
  - send: exit
  # Deadline form, not `wait` + bare `expect_exit`: shell exit is not instant
  # (Git for Windows bash under ConPTY needs more than 500ms), and polling to
  # a deadline removes the race instead of guessing a sleep.
  - expect_exit:
      code: 0
      timeout: 10s
