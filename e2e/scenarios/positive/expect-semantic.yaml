# Dogfood: expect_semantic over a real PTY. After the shell prints a known
# message, expect_semantic asserts the output is lexically close to an expected
# text above a threshold. Proves the lexical-approximation backend works end to
# end when pitty runs itself. (snapshot is not dogfooded here because it would
# commit a terminal-dependent snapshot file into the repo.)
name: expect-semantic
workspace:
  temp: true
steps:
  - spawn: bash
  # The message is assembled by printf from separate words and written to a
  # workspace file, and expect_semantic reads that file. The PTY buffer is not
  # the comparison source, so neither the echoed command line nor the shell's
  # platform-dependent startup output (prompt, locale notices) can satisfy or
  # dilute the similarity. The computed sentinel (see echo-flow.yaml) proves
  # the write finished before the comparison runs.
  - send: printf '%s failed due to an %s token\n' Authentication expired > semantic.txt; echo WRITTEN_$((40+2))
  - expect:
      contains: WRITTEN_42
      timeout: 10s
  - expect_semantic:
      text: |
        authentication failed expired token
      similarity: 0.5
      source:
        file: semantic.txt
