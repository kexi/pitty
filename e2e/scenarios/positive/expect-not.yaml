# Dogfood: expect_not over a real PTY. Mirrors the former tests/e2e.rs
# `expect_not_passes_when_pattern_absent_over_pty`. After echoing `ok`,
# asserting `error` is absent must pass.
name: expect-not
workspace:
  temp: true
steps:
  - spawn: bash
  # See echo-flow.yaml for why the needle is computed rather than typed.
  - send: echo ok-$((40+2))
  - expect:
      contains: ok-42
      timeout: 10s
  - expect_not:
      contains: error
