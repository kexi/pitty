# Dogfood: minimal echo flow. Mirrors the former tests/e2e.rs
# `minimal_echo_flow_passes`. Proves spawn -> send -> expect works over a real
# PTY when pitty runs itself.
name: echo-flow
workspace:
  temp: true
steps:
  - spawn: bash
  # `$((40+2))` keeps the needle out of the typed line: the PTY echoes input,
  # so a literal `hello-42` would match its own echo before bash ran anything.
  - send: echo hello-$((40+2))
  - expect:
      contains: hello-42
      timeout: 10s
