# Dogfood: output larger than the reader's READ_CHUNK (4096 bytes). Mirrors the
# former tests/e2e.rs `long_output_beyond_read_chunk_matches_trailing_needle`.
# A sentinel after ~6000 'A's must still match, proving chunks append
# contiguously.
name: long-output
workspace:
  temp: true
steps:
  - spawn: bash
  # The sentinel is assembled by printf so it exists only in real output; the
  # echoed command line contains `SENTINEL_%s`, never `SENTINEL_END_42`. That
  # keeps the >4096-byte reader path honest: the match can only land after
  # all 6000 bytes have streamed through.
  - send: printf 'A%.0s' $(seq 1 6000); printf 'SENTINEL_%s\n' END_$((40+2))
  - expect:
      contains: SENTINEL_END_42
      timeout: 10s
